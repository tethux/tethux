[tools]
go = "1.26.5"
sqlite = "3.51.2"

golangci-lint = "2.10.1"
sqlc = "1.31.1"
bun = "1.3.11"
ripgrep = "latest"
"go:github.com/air-verse/air" = "1.64.5"

"github:nrempel/sleek" = "v0.5.0"
"go:mvdan.cc/gofumpt" = "0.9.2"
"go:golang.org/x/tools/cmd/goimports" = "0.42.0"


# dev

[tasks.fmt]
alias = "format"
description = "Format all source code"
depends = ["fmt:go", "fmt:sql", "fmt:web"]

[tasks."fmt:go"]
description = "Format Go source"
run = [
	"rg --files -g '*.go' -g '!tools/ci-results/viewer/frontend/node_modules/**' | xargs goimports -w",
	"rg --files -g '*.go' -g '!tools/ci-results/viewer/frontend/node_modules/**' | xargs gofumpt -w",
	"go mod tidy",
]

[tasks."fmt:sql"]
description = "Format SQL queries and migrations"
run = [
	"sleek 'internal/ciresults/db/queries/*.sql'",
	"sleek 'internal/ciresults/db/migrations/*.sql'",
]

[tasks."fmt:web"]
description = "Format the CI viewer frontend"
dir = "tools/ci-results/viewer/frontend"
depends = ["install:web"]
run = "bun run format"

[tasks."install:web"]
description = "Install locked CI viewer frontend dependencies"
dir = "tools/ci-results/viewer/frontend"
run = "bun install --frozen-lockfile"

[tasks."dev:container-udp"]
description = "Run UDP container topology"
depends = ["fixture-registry:start"]
run = "go run -tags debug ./tools/ci bridge topology --runtime ${RUNTIME:-podman} --n ${N:-4}"

[tasks."fixture-registry:start"]
description = "Start and seed the local topology fixture registry sidecar"
run = '''
runtime="${RUNTIME:-podman}"
registry_name="tethux-fixture-registry"
seed_name="tethux-fixture-seed"
registry="127.0.0.1:5000"
base_image="docker.io/library/alpine:3.22"
network_flag=""
if [ "$runtime" = "podman" ]; then
  network_flag="--network=pasta"
fi

if "$runtime" container inspect "$registry_name" >/dev/null 2>&1; then
  "$runtime" start "$registry_name" >/dev/null
else
  "$runtime" run -d \
    $network_flag \
    --name "$registry_name" \
    --restart unless-stopped \
    -p 127.0.0.1:5000:5000 \
    docker.io/library/registry:2 >/dev/null
fi

for attempt in $(seq 1 30); do
  if curl --fail --silent "http://$registry/v2/" >/dev/null; then
    break
  fi
  if [ "$attempt" -eq 30 ]; then
    echo "fixture registry did not become ready at http://$registry" >&2
    exit 1
  fi
  sleep 1
done

"$runtime" rm -f "$seed_name" >/dev/null 2>&1 || true
"$runtime" pull "$base_image" >/dev/null
"$runtime" run $network_flag --name "$seed_name" "$base_image" \
  sh -c 'apk add --no-cache iproute2 iputils >/dev/null'
"$runtime" commit "$seed_name" "$registry/tethux/fixture-a:1" >/dev/null
"$runtime" tag "$registry/tethux/fixture-a:1" "$registry/tethux/fixture-b:1"

if [ "$runtime" = "podman" ]; then
  "$runtime" push --tls-verify=false "$registry/tethux/fixture-a:1" >/dev/null
  "$runtime" push --tls-verify=false "$registry/tethux/fixture-b:1" >/dev/null
else
  "$runtime" push "$registry/tethux/fixture-a:1" >/dev/null
  "$runtime" push "$registry/tethux/fixture-b:1" >/dev/null
fi

"$runtime" rm -f "$seed_name" >/dev/null
echo "fixture registry ready: $registry/tethux/fixture-a:1"
'''

[tasks."fixture-registry:status"]
description = "Show local fixture registry sidecar status and catalog"
run = '''
runtime="${RUNTIME:-podman}"
"$runtime" ps --filter name=tethux-fixture-registry
curl --fail --silent http://127.0.0.1:5000/v2/_catalog
echo
'''

[tasks."fixture-registry:stop"]
description = "Stop and remove the local fixture registry sidecar"
run = '''
runtime="${RUNTIME:-podman}"
"$runtime" rm -f tethux-fixture-registry
'''

[tasks."run:tethux"]
description = "Run multicall help"
run = "go run -tags debug ./cmd/tethux"

[tasks."run:bridge"]
description = "Run standalone bridge"
run = "go run -tags debug ./cmd/bridge/main"

[tasks."run:virt"]
description = "Run standalone virt"
run = "go run -tags debug ./cmd/virt/main"

# build

[tasks.build]
description = "Build all binaries"
depends = [
	"build:create-bin-dir",
	"build:go",
	"build:standalone",
	"build:ci-results",
	"build:ci",
	"build:symlinks",
]

[tasks."build:create-bin-dir"]
hide = true
run = "mkdir -p ./bin"

[tasks."build:go"]
description = "Build multicall binary with development assertions"
depends = ["build:create-bin-dir"]
run = "go build -tags debug -o ./bin/tethux ./cmd/tethux"

[tasks."build:standalone"]
description = "Build standalone binaries with development assertions"
depends = ["build:create-bin-dir"]
run = """
go build -tags debug -o ./bin/tethux-bridge ./cmd/bridge/main
go build -tags debug -o ./bin/tethux-virt ./cmd/virt/main
"""

[tasks."build:viewer-frontend"]
description = "Build the SvelteKit SPA for embedding"
dir = "tools/ci-results/viewer/frontend"
depends = ["install:web"]
run = "bun run build"

[tasks."build:ci-results"]
description = "Build the combined CI ingestion and viewer CLI"
depends = ["build:create-bin-dir", "build:viewer-frontend"]
run = "go build -o ./bin/ci-results ./tools/ci-results"

[tasks."build:ci"]
description = "Build the declarative repository automation CLI"
depends = ["build:create-bin-dir"]
run = "go build -o ./bin/tethux-ci ./tools/ci"

[tasks."build:symlinks"]
description = "Create multicall symlinks"
depends = ["build:go"]
run = """
cd ./bin
ln -sf tethux bridge
ln -sf tethux virt
"""

# ci

[tasks.check]
description = "Run the complete local quality gate"
depends = ["check:format", "lint", "test", "build"]

[tasks.lint]
description = "Run all linters"
depends = ["lint:asserts", "lint:go", "lint:web"]

[tasks."lint:asserts"]
description = "Reject expensive invariant scans in release builds"
run = "go run ./tools/assertlint ."

[tasks."lint:go"]
description = "Run Go linter"
depends = ["build:viewer-frontend"]
run = "golangci-lint run -c .golangci.yml"

[tasks."lint:web"]
description = "Lint and type-check the CI viewer frontend"
dir = "tools/ci-results/viewer/frontend"
depends = ["install:web"]
run = "bun run lint"

[tasks."check:format"]
description = "Check Go and web formatting without changing files"
depends = ["check:format:go", "check:format:web"]

[tasks."check:format:go"]
description = "Check Go formatting and module metadata"
run = [
	"test -z \"$(goimports -l $(rg --files -g '*.go' -g '!tools/ci-results/viewer/frontend/node_modules/**'))\"",
	"test -z \"$(gofumpt -l $(rg --files -g '*.go' -g '!tools/ci-results/viewer/frontend/node_modules/**'))\"",
	"go mod tidy -diff",
]

[tasks."check:format:web"]
description = "Check CI viewer frontend formatting"
dir = "tools/ci-results/viewer/frontend"
depends = ["install:web"]
run = "bun run format:check"

[tasks.test]
description = "Run all tests"
depends = ["test:go", "test:web"]

[tasks."test:go"]
description = "Run Go tests"
depends = ["build:viewer-frontend"]
run = "go list -tags debug ./... | rg -v '/node_modules/' | xargs go test -tags debug"

[tasks."test:web"]
description = "Validate the CI viewer frontend"
dir = "tools/ci-results/viewer/frontend"
depends = ["install:web"]
run = ["bun run check", "bun run test:theme"]

[tasks.sqlc]
description = "Regenerate typed database queries"
run = "sqlc generate"

[tasks."dev:viewer"]
description = "Run the viewer with Go reloads and frontend HMR"
run = '''
go run ./tools/ci-results ingest -path ./ingestion/archive -db ./data/ci/ci-res.db

air -c .air.toml &
backend_pid=$!
cleanup_viewer() {
    pkill -TERM -P "$backend_pid" 2>/dev/null || true
    kill -TERM "$backend_pid" 2>/dev/null || true
    wait "$backend_pid" 2>/dev/null || true
}
trap cleanup_viewer EXIT INT TERM

cd tools/ci-results/viewer/frontend
bun run dev --host localhost --port "${PORT:-5173}"
'''

[tasks.ci]
description = "Alias for the local quality gate"
depends = ["check"]

[tasks."test:host:providers"]
description = "Run privileged container provider smoke tests"
run = "go run ./tools/ci run provider --provider all"

[tasks."ci:laptop"]
description = "Run lint, unit tests, all provider operations, and one bridge topology"
run = "go run ./tools/ci run laptop --runtime ${RUNTIME:?set RUNTIME=docker or podman}"

[tasks."test:integration:local"]
description = "Opt-in archived provider, bridge-backend, and topology integration run"
run = "go run ./tools/ci run local --integration --runtime ${RUNTIME:?set RUNTIME=docker or podman}"

[tasks."test:bridge"]
description = "Run bridge unit and parser tests"
run = "go test -tags debug ./cmd/bridge/... ./internal/libtethux/bridge/..."

[tasks."test:bridge:integration"]
description = "Run and archive UDP/raw/pcap/TAP bridge conformance tests"
run = "go run ./tools/ci bridge test --archive --archive-root ${ARCHIVE_ROOT:-./ingestion/archive}"

[tasks."test:bridge:integration:list"]
description = "List bridge conformance backends without requiring root"
run = "go run ./tools/ci bridge list"

[tasks.topology]
description = "Run an archived container topology, then ingest it into the local results database"
depends = ["fixture-registry:start"]
run = '''
archive_root="${ARCHIVE_ROOT:-./ingestion/archive}"
results_db="${RESULTS_DB:-./data/ci/ci-res.db}"
runtime="${RUNTIME:-podman}"

go run ./tools/ci bridge all \
	--runtime "$runtime" \
	--archive-root "$archive_root"

go run ./tools/ci-results ingest --path "$archive_root" --db "$results_db"
'''

[tasks."topology:ingest"]
description = "Ingest existing local topology/test archives into SQLite"
run = "go run ./tools/ci-results ingest --path ${ARCHIVE_ROOT:-./ingestion/archive} --db ${RESULTS_DB:-./data/ci/ci-res.db}"

[tasks."test:integration:nas"]
description = "Opt-in local integration run, atomically published to the NAS"
run = "TETHUX_ARCHIVE_NAS_HOST=${NAS_HOST:-nas} go run ./tools/ci run local --integration --runtime ${RUNTIME:?set RUNTIME=docker or podman}"

[tasks."test:bridge:integration:nas"]
description = "Opt-in backend packet tests, atomically published to the NAS"
run = "TETHUX_ARCHIVE_NAS_HOST=${NAS_HOST:-nas} go run ./tools/ci bridge test --archive"

[tasks."archive:nas:inventory"]
description = "Write a local ignored inventory of NAS test archives and schemas"
run = "go run ./tools/ci archive inventory --host ${NAS_HOST:-nas}"

[tasks."test:host:topology"]
description = "Run and ingest the privileged bridge topology smoke test"
run = "mise run topology"

[tasks."test:host:hypervisors"]
description = "Run privileged network and hypervisor smoke tests"
run = "go run ./tools/ci run hypervisors"

[tasks."host:discover"]
description = "Discover known tethux test hosts on the LAN"
run = "go run ./tools/ci host discover --subnet ${SUBNET:-}"

[tasks."host:audit"]
description = "Audit a test host over SSH, e.g. HOST=ci@10.0.0.100 mise run host:audit"
run = "go run ./tools/ci host audit --host ${HOST:?set HOST=user@host}"

[tasks."host:audit:proxmox-vm-9901"]
description = "Audit optional Proxmox VM 9901 through its Tailscale-reachable jump host"
run = "go run ./tools/ci host audit --jump-host ${TETHUX_SSH_JUMP:-root@100.115.225.73} --host ${HOST:-ci@192.168.0.107}"
