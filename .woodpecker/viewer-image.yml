when:
  - event: push
  - event: pull_request
  - event: manual

labels:
  host: nas
  github: "true"
  podman: "true"

steps:
  build-viewer-image:
    image: head1328/woodpecker-ci-plugin-podman
    pull: true
    settings:
      context: .
      containerfile: tools/ci-results/viewer/Dockerfile
      dry_run: true
      cache: true
      tls_verify: false
      build_args:
        - BUN_IMAGE=ci-registry:5000/oven/bun:1-alpine
        - GO_IMAGE=ci-registry:5000/library/golang:1.26.4-alpine
        - RUNTIME_IMAGE=ci-registry:5000/library/alpine:3.23
      tags:
        - ${CI_COMMIT_SHA}
    when:
      - event: pull_request
      - event: manual

  deploy-viewer-and-ingest:
    image: docker:dind
    pull: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build --pull=false -t tethux-ci-viewer:latest -f tools/ci-results/viewer/Dockerfile .
      - docker compose -f tools/ci-results/viewer/compose.yaml up -d --force-recreate viewer ingest
    when:
      - event: push
        branch: master
