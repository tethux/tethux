when:
  - event: push
  - event: pull_request
  - event: manual

labels:
  host: nas
  github: "true"
  podman: "true"

steps:
  build-viewer-image:
    image: head1328/woodpecker-ci-plugin-podman
    pull: true
    settings:
      context: .
      containerfile: tools/ci-results/viewer/Dockerfile
      dry_run: true
      cache: true
      tls_verify: false
      build_args:
        - BUN_IMAGE=ci-registry:5000/oven/bun:1-alpine
        - GO_IMAGE=ci-registry:5000/library/golang:1.26-alpine
        - RUNTIME_IMAGE=ci-registry:5000/library/alpine:3.23
      tags:
        - ${CI_COMMIT_SHA}
