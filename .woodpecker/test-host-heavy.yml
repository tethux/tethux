when:
  - event: cron
  - event: manual

labels:
  tethux-test-host: "true"
  privileged: "true"
  host: nas

steps:
  hypervisor-smoke:
    image: nixos/nix
    pull: false
    privileged: true
    environment:
      TETHUX_TEST_ARCHIVE_ROOT: /var/lib/tethux-ci/archive
    volumes:
      - tethux-ci-nix:/nix
      - /var/cache/tethux-ci/go-build:/root/.cache/go-build
      - /var/cache/tethux-ci/go-mod:/root/go/pkg/mod
      - /var/cache/tethux-ci/archive:/var/lib/tethux-ci/archive
    commands:
      - nix develop --extra-experimental-features "nix-command flakes" -c go run ./tools/ci run hypervisors --archive --device nas-runner-1

  large-topology:
    image: nixos/nix
    pull: false
    privileged: true
    volumes:
      - tethux-ci-nix:/nix
      - /root/.ssh/id_rsa:/root/.ssh/id_rsa:ro
      - /root/.ssh/known_hosts:/root/.ssh/known_hosts
      - /var/cache/tethux-ci/go-build:/root/.cache/go-build
      - /var/cache/tethux-ci/go-mod:/root/go/pkg/mod
      - /var/cache/tethux-ci/archive:/var/lib/tethux-ci/archive
    environment:
      TETHUX_TEST_ARCHIVE_ROOT: /var/lib/tethux-ci/archive
      TETHUX_TOPOLOGY_SMALL_N: "4"
      TETHUX_TOPOLOGY_LARGE_N: "32"
      TETHUX_TOPOLOGY_PARALLEL_JOBS: "8"
    commands:
      - nix develop .#ci --extra-experimental-features "nix-command flakes" -c go run ./tools/ci run remote-laptop --host ci@10.0.0.100 --runtime docker --archive --device laptop-100
