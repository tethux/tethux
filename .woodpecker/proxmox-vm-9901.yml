when:
  - event: manual

labels:
  host: nas
  tethux-test-host: "true"
  privileged: "true"

depends_on:
  - checks

steps:
  optional-proxmox-provider-and-networking:
    image: nixos/nix
    pull: false
    volumes:
      - tethux-ci-nix:/nix
      - /var/cache/tethux-ci/go-build:/root/.cache/go-build
      - /var/cache/tethux-ci/go-mod:/root/go/pkg/mod
      - /var/cache/tethux-ci/archive:/var/lib/tethux-ci/archive
    commands:
      - nix develop .#ci --extra-experimental-features "nix-command flakes" -c go run ./tools/ci run remote-laptop --host ci@192.168.0.107 --jump-host root@100.115.225.73 --runtime docker --archive --device proxmox-vm-9901
