when:
  - event: push
  - event: pull_request
  - event: manual

labels:
  host: nas
  tethux-test-host: "true"
  privileged: "true"

steps:
  lint-test-build-and-nix:
    image: nixos/nix
    pull: false
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://10.0.0.21:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_RESOURCE_ATTRIBUTES: service.name=tethux-ci,ci.pipeline=normal
    volumes:
      - tethux-ci-nix:/nix
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - export OTEL_RESOURCE_ATTRIBUTES="service.name=tethux-ci,ci.pipeline=$CI_PIPELINE_NAME,ci.repository=$CI_REPO,ci.commit=$CI_COMMIT_SHA,ci.run.url=$CI_PIPELINE_URL"
      - export DAGGER_TRACE_NAME="$CI_REPO_NAME:$CI_PIPELINE_NAME:$CI_COMMIT_SHA"
      - nix develop .#ci --extra-experimental-features "nix-command flakes" -c mise exec -- dagger call normal --source=.
