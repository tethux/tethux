version: "2"

linters:
  disable:
    - dupl
    - gocyclo

  enable:
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - nilnil
    - noctx
    - prealloc
    - staticcheck

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment

    revive:
      severity: warning
      rules:
        - name: exported
          disabled: true

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - wrapperFunc

    errcheck:
      check-type-assertions: true
      check-blank: false

  exclusions:
    generated: strict
    presets: []

    rules:
      # The CI framework passes declarative value objects by value for an
      # immutable API. Archive paths stay beneath framework-created stages,
      # and SSH/SCP arguments are validated and passed without a shell.
      - path: internal/ci/
        linters:
          - gocritic
        text: "hugeParam|rangeValCopy"

      - path: internal/ci/
        linters:
          - gosec
        text: "G204|G304|G104|G122|G302"

      - path: internal/ci/archive\.go
        linters:
          - govet
        text: 'shadow: declaration of "err"'

      # These privileged lab harnesses intentionally execute selected runtime,
      # network, and hypervisor binaries supplied by the operator.
      - path: tools/bridge/(example|testing)/
        linters:
          - gosec
          - gocritic
          - errorlint
          - govet
          - noctx

      # The operations CLI reads operator-selected archive paths and creates
      # group-readable CI logs in a loopback/local-runner trust boundary.
      - path: tools/ci/main\.go
        linters:
          - gosec
        text: "G204|G302|G304"

      - path: tools/ci/main\.go
        linters:
          - gocritic
        text: "exitAfterDefer|hugeParam|rangeValCopy|httpNoBody"

      - path: tools/ci/main\.go
        linters:
          - govet
        text: 'shadow: declaration of "err"'

      - path: tools/ci/main\.go
        linters:
          - noctx
        text: "os/exec.Command"

      # Allow password/access token fields in API schemas.
      - linters:
          - gosec
        text: "G117"

      # Temp file operations from os.CreateTemp are safe.
      - linters:
          - gosec
        text: "G703"

      # User's editor choice is intentional.
      - linters:
          - gosec
        text: "G702"

      # API clients make requests to configured endpoints.
      - linters:
          - gosec
        text: "G704"

      # Ignore Close errors where explicitly accepted by repository policy.
      - linters:
          - errcheck
        text: "Error return value of `.*Close` is not checked"

      # Ignore Fprintf errors for stdout/stderr diagnostics.
      - linters:
          - errcheck
        text: "Error return value of `.*Fprintf.*` is not checked"

      # Ignore err shadowing inside deferred cleanup.
      - linters:
          - govet
        text: 'shadow: declaration of "err"'
        source: "defer "
