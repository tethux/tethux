schema = 1

[analysis]
build_tags=["debug"]

[rules.no-any]
enabled = false

[rules.direct-error-comparison]
enabled = false

[rules.package-boundaries]
enabled = true
include_tests = true

[[rules.package-boundaries.boundaries]]
name = "storage-is-independent"
from = ["storage"]
deny_imports = ["github.com/tethux/tethux/virt", "github.com/tethux/tethux/topology", "github.com/tethux/tethux/bridge"]

[[rules.package-boundaries.boundaries]]
name = "bridge-is-independent"
from = ["bridge"]
deny_imports = ["github.com/tethux/tethux/virt", "github.com/tethux/tethux/topology", "github.com/tethux/tethux/storage"]

[[rules.package-boundaries.boundaries]]
name = "providers-consume-storage-contracts"
from = ["virt/container/docker", "virt/container/moby", "virt/container/podman", "virt/container/containerd", "virt/hypervisor", "virt/domain", "virt/emulator"]
deny_imports = ["github.com/tethux/tethux/storage/local", "github.com/tethux/tethux/topology"]

[[rules.package-boundaries.boundaries]]
name = "topology-model-is-portable"
from = ["topology"]
deny_imports = ["github.com/tethux/tethux/virt", "github.com/tethux/tethux/storage", "github.com/tethux/tethux/bridge"]
exclude_dirs = ["topology/local"]

[rules.no-discarded-cleanup-error]
enabled = true
type_check = true
paths = ["storage", "virt", "topology", "cmd/virt", "cmd/topology", "internal/ci"]
calls = ["*.Release", "*.Close", "*.Free", "*.Delete", "*.DeleteContainer"]

[rules.cleanup-context-policy]
enabled = true
paths = ["virt/container/manager.go", "virt/domain/manager.go", "virt/emulator/dynamips/manager.go", "topology/local/container.go"]
functions = ["rollback", "Prepare", "Create", "Start"]
calls = ["*.Release", "*.Close"]
context_factories = ["github.com/tethux/tethux/internal/cleanup.NewContext"]

[rules.subprocess-context]
enabled=true
type_check=true
context_factories=["context.WithTimeout", "context.WithDeadline", "os/signal.NotifyContext", "github.com/spf13/cobra.Command.Context"]
paths=["internal/ci", "cmd/virt", "tools/ci"]
[rules.blocking-under-lock]
enabled=true
paths=["storage", "virt", "topology"]
guard="o.mu"
assume_locked_functions=["broadcastLocked"]
[rules.suppression-policy]
enabled=true
