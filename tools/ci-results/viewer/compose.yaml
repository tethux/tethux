name: tethux-ci-viewer

services:
  viewer:
    image: ${TETHUX_VIEWER_IMAGE:-tethux-ci-viewer:latest}
    container_name: tethux-ci-viewer
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ${TETHUX_VIEWER_DATA_DIR:-/var/cache/tethux-ci/viewer}:/data
    command: [serve, --address, 0.0.0.0, --port, "8080", --db, /data/ci-res.db]
    networks: [viewer]

  ingest:
    image: ${TETHUX_VIEWER_IMAGE:-tethux-ci-viewer:latest}
    container_name: tethux-ci-viewer-ingest
    restart: unless-stopped
    user: "0:0"
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ${TETHUX_VIEWER_DATA_DIR:-/var/cache/tethux-ci/viewer}:/data
      - ${TETHUX_VIEWER_ARCHIVE_DIR:-/var/cache/tethux-ci/archive}:/archive:ro
    command: [watch, --path, /archive, --db, /data/ci-res.db, --poll, 15s]
    networks: [viewer]

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: tethux-ci-viewer-tunnel
    profiles: [tunnel]
    restart: unless-stopped
    read_only: true
    env_file:
      - ${TETHUX_VIEWER_ENV_FILE:-.env}
    command: [tunnel, --no-autoupdate, run]
    networks: [viewer]

networks:
  viewer:
    name: ${TETHUX_VIEWER_NETWORK:-tethux-ci-viewer}
    external: true
